<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    .candidate-card {
      box-sizing: border-box;
      height: 308px;
      border: 1px solid rgba(27, 55, 34, 0.12);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 18px 40px rgba(38, 52, 37, 0.08);
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      outline: none;
    }
    .candidate-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 44px rgba(38, 52, 37, 0.12);
    }
    .candidate-card.is-selected {
      background: linear-gradient(180deg, rgba(227, 239, 255, 0.98) 0%, rgba(208, 228, 255, 0.92) 100%);
      border: 1.5px solid rgba(50, 108, 197, 0.42);
      box-shadow: 0 20px 44px rgba(64, 119, 198, 0.18);
    }
    .candidate-card:focus-visible {
      border-color: rgba(50, 108, 197, 0.72);
      box-shadow: 0 0 0 3px rgba(50, 108, 197, 0.16);
    }
    .candidate-grid-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 0.55rem;
    }
    .candidate-badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: #e6efe8;
      color: #20442d;
      font-weight: 700;
      font-size: 0.78rem;
    }
    .candidate-selected-badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: #2f6fd6;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.76rem;
    }
    .candidate-rank,
    .candidate-grid-confidence {
      color: #66756b;
      font-size: 0.82rem;
    }
    .candidate-grid-title {
      color: #193022;
      font-size: 1.12rem;
      font-weight: 700;
      margin-bottom: 0.45rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .candidate-grid-title a {
      color: inherit;
      text-decoration: none;
    }
    .candidate-grid-title a:hover {
      text-decoration: underline;
    }
    .candidate-grid-copy,
    .candidate-grid-reason {
      color: #36463e;
      line-height: 1.55;
      font-size: 0.92rem;
      word-break: break-word;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
    }
    .candidate-grid-copy {
      margin-bottom: 0.55rem;
      -webkit-line-clamp: 4;
    }
    .candidate-grid-reason {
      color: #5d6c62;
      -webkit-line-clamp: 2;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const root = document.getElementById("root")
    let args = {}

    function sendMessage(type, payload = {}) {
      window.parent.postMessage(
        {
          isStreamlitMessage: true,
          type,
          ...payload,
        },
        "*"
      )
    }

    function setComponentReady() {
      sendMessage("streamlit:componentReady", { apiVersion: 1 })
    }

    function setFrameHeight(height) {
      sendMessage("streamlit:setFrameHeight", { height })
    }

    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", { value })
    }

    function render() {
      root.replaceChildren()

      const card = document.createElement("div")
      card.className = `candidate-card${args.selected ? " is-selected" : ""}`
      card.tabIndex = 0
      card.setAttribute("role", "button")
      card.setAttribute("aria-pressed", args.selected ? "true" : "false")

      const topWrap = document.createElement("div")
      const meta = document.createElement("div")
      meta.className = "candidate-grid-meta"

      const badge = document.createElement("span")
      badge.className = "candidate-badge"
      badge.textContent = args.board_label || ""
      meta.appendChild(badge)

      const rank = document.createElement("span")
      rank.className = "candidate-rank"
      rank.textContent = args.rank || ""
      meta.appendChild(rank)

      if (args.selected) {
        const selectedBadge = document.createElement("span")
        selectedBadge.className = "candidate-selected-badge"
        selectedBadge.textContent = "선택 중"
        meta.appendChild(selectedBadge)
      }

      const confidence = document.createElement("div")
      confidence.className = "candidate-grid-confidence"
      confidence.textContent = `신뢰도 ${args.confidence || "0.00"} · ${args.source_host || ""}`

      const title = document.createElement("div")
      title.className = "candidate-grid-title"
      const titleLink = document.createElement("a")
      titleLink.href = args.source_url || "#"
      titleLink.target = "_blank"
      titleLink.rel = "noopener noreferrer"
      titleLink.textContent = args.title || ""
      titleLink.addEventListener("click", event => {
        event.stopPropagation()
      })
      title.appendChild(titleLink)

      const summary = document.createElement("div")
      summary.className = "candidate-grid-copy"
      summary.textContent = args.summary || ""

      topWrap.appendChild(meta)
      topWrap.appendChild(confidence)
      topWrap.appendChild(title)
      topWrap.appendChild(summary)

      const reason = document.createElement("div")
      reason.className = "candidate-grid-reason"
      reason.textContent = args.why_relevant || ""

      const emitSelection = () => {
        setComponentValue(Date.now())
      }

      card.addEventListener("click", event => {
        if (event.target.closest("a")) {
          return
        }
        emitSelection()
      })

      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault()
          emitSelection()
        }
      })

      card.appendChild(topWrap)
      card.appendChild(reason)
      root.appendChild(card)

      requestAnimationFrame(() => {
        setFrameHeight(328)
      })
    }

    window.addEventListener("message", event => {
      if (event.data.type !== "streamlit:render") {
        return
      }
      args = event.data.args || {}
      render()
    })

    setComponentReady()
  </script>
</body>
</html>
