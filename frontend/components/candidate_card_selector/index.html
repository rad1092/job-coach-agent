<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

    :root {
      color-scheme: light;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(105, 141, 181, 0.22);
      --card-shadow: 0 18px 38px rgba(42, 79, 120, 0.14);
      --ink: #163650;
      --muted: #59748f;
      --accent-soft: #eef5ff;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }

    .candidate-card {
      box-sizing: border-box;
      min-height: 316px;
      border: 1px solid var(--card-border);
      border-radius: 22px;
      background: var(--card-bg);
      box-shadow: var(--card-shadow);
      padding: 1rem 1.05rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      outline: none;
      backdrop-filter: blur(10px);
    }

    .candidate-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 42px rgba(42, 79, 120, 0.18);
    }

    .candidate-card.is-selected {
      background: linear-gradient(180deg, rgba(239, 247, 255, 0.98) 0%, rgba(225, 238, 255, 0.96) 100%);
      border: 1.5px solid rgba(35, 116, 212, 0.42);
      box-shadow: 0 22px 44px rgba(37, 106, 182, 0.18);
    }

    .candidate-card:focus-visible {
      border-color: rgba(35, 116, 212, 0.74);
      box-shadow: 0 0 0 3px rgba(31, 122, 224, 0.16);
    }

    .candidate-grid-meta {
      display: flex;
      gap: 0.46rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 0.58rem;
    }

    .candidate-badge,
    .candidate-selected-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.24rem 0.58rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.76rem;
      line-height: 1;
    }

    .candidate-badge {
      background: #edf5ff;
      color: #2c5a86;
    }

    .candidate-selected-badge {
      background: linear-gradient(180deg, #2d8ff4 0%, #176dc8 100%);
      color: #ffffff;
    }

    .candidate-rank,
    .candidate-grid-confidence {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .candidate-grid-title {
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 800;
      margin: 0.42rem 0 0.48rem 0;
      line-height: 1.38;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .candidate-grid-title a {
      color: inherit;
      text-decoration: none;
    }

    .candidate-grid-title a:hover {
      text-decoration: underline;
    }

    .candidate-grid-copy,
    .candidate-grid-reason {
      color: #34506a;
      line-height: 1.58;
      font-size: 0.92rem;
      word-break: break-word;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
    }

    .candidate-grid-copy {
      margin-bottom: 0.52rem;
      -webkit-line-clamp: 4;
    }

    .candidate-grid-reason {
      color: #5b758f;
      -webkit-line-clamp: 3;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(105, 141, 181, 0.14);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const root = document.getElementById("root")
    let args = {}

    function sendMessage(type, payload = {}) {
      window.parent.postMessage(
        {
          isStreamlitMessage: true,
          type,
          ...payload,
        },
        "*"
      )
    }

    function setComponentReady() {
      sendMessage("streamlit:componentReady", { apiVersion: 1 })
    }

    function setFrameHeight(height) {
      sendMessage("streamlit:setFrameHeight", { height })
    }

    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", { value })
    }

    function render() {
      root.replaceChildren()

      const card = document.createElement("div")
      card.className = `candidate-card${args.selected ? " is-selected" : ""}`
      card.tabIndex = 0
      card.setAttribute("role", "button")
      card.setAttribute("aria-pressed", args.selected ? "true" : "false")

      const topWrap = document.createElement("div")
      const meta = document.createElement("div")
      meta.className = "candidate-grid-meta"

      const badge = document.createElement("span")
      badge.className = "candidate-badge"
      badge.textContent = args.board_label || ""
      meta.appendChild(badge)

      const rank = document.createElement("span")
      rank.className = "candidate-rank"
      rank.textContent = args.rank || ""
      meta.appendChild(rank)

      if (args.selected) {
        const selectedBadge = document.createElement("span")
        selectedBadge.className = "candidate-selected-badge"
        selectedBadge.textContent = "현재 선택"
        meta.appendChild(selectedBadge)
      }

      const confidence = document.createElement("div")
      confidence.className = "candidate-grid-confidence"
      confidence.textContent = `신뢰도 ${args.confidence || "0.00"} · ${args.source_host || ""}`

      const title = document.createElement("div")
      title.className = "candidate-grid-title"
      const titleLink = document.createElement("a")
      titleLink.href = args.source_url || "#"
      titleLink.target = "_blank"
      titleLink.rel = "noopener noreferrer"
      titleLink.textContent = args.title || ""
      titleLink.addEventListener("click", event => {
        event.stopPropagation()
      })
      title.appendChild(titleLink)

      const summary = document.createElement("div")
      summary.className = "candidate-grid-copy"
      summary.textContent = args.summary || ""

      topWrap.appendChild(meta)
      topWrap.appendChild(confidence)
      topWrap.appendChild(title)
      topWrap.appendChild(summary)

      const reason = document.createElement("div")
      reason.className = "candidate-grid-reason"
      reason.textContent = args.why_relevant || ""

      const emitSelection = () => {
        setComponentValue(Date.now())
      }

      card.addEventListener("click", event => {
        if (event.target.closest("a")) {
          return
        }
        emitSelection()
      })

      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault()
          emitSelection()
        }
      })

      card.appendChild(topWrap)
      card.appendChild(reason)
      root.appendChild(card)

      requestAnimationFrame(() => {
        setFrameHeight(338)
      })
    }

    window.addEventListener("message", event => {
      if (event.data.type !== "streamlit:render") {
        return
      }
      args = event.data.args || {}
      render()
    })

    setComponentReady()
  </script>
</body>
</html>
