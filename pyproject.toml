[project]
name = "job-coach-runtime"
version = "0.1.0"
description = "Local FastAPI and Streamlit runtime for the job coach product."
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13.3",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "langgraph>=1.0.10",
  "openai>=2.4.0",
  "playwright>=1.55.0",
  "pydantic-settings>=2.11.0",
  "streamlit>=1.49.1",
  "tavily-python>=0.7.12",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
